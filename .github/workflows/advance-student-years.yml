name: Advance student years

# Once a year, shortly before UT's fall semester starts (classes usually
# begin in the last week of August), bump everyone's academic year:
# "3rd year" -> "4th year", "Junior" -> "Senior", and so on.
#
# Deliberately scheduled for Aug 15 so the PR is sitting there for a week
# or two before the semester actually starts, rather than landing the
# morning of. Also runnable on demand from the Actions tab — use the
# dry_run option there to preview the plan without touching anything.
on:
  schedule:
    - cron: "0 6 15 8 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan without changing any files"
        type: boolean
        default: false

concurrency:
  group: advance-student-years
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # A repository ruleset on main requires changes to arrive via pull
      # request, so this job opens a PR rather than pushing directly.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Advance years
        env:
          # The script writes a markdown summary here, which becomes both
          # the run summary and the body of the PR below.
          ADVANCE_SUMMARY_PATH: ${{ runner.temp }}/advance-summary.md
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run advance-years -- --dry-run
          else
            npm run advance-years
          fi

      - name: Publish run summary
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/advance-summary.md" ]; then
            cat "${{ runner.temp }}/advance-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit changes and open a pull request
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "academic-year-bot[bot]"
          git config user.email "academic-year-bot[bot]@users.noreply.github.com"
          git add src/content/people
          if git diff --staged --quiet -- src/content/people; then
            echo "No student years to advance."
            exit 0
          fi

          YEAR="$(date -u +%Y)"
          BRANCH="chore/advance-student-years-$YEAR"
          # -B so a re-run in the same year updates the branch instead of
          # hard-failing on an existing one.
          git checkout -B "$BRANCH"
          git commit -m "chore(people): advance student years for AY $YEAR"
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR for $BRANCH is already open — pushed an update to it."
            exit 0
          fi

          SUMMARY="${{ runner.temp }}/advance-summary.md"
          {
            echo "Annual academic-year rollover for $YEAR, generated by"
            echo '`.github/workflows/advance-student-years.yml`.'
            echo
            if [ -f "$SUMMARY" ]; then cat "$SUMMARY"; fi
            echo
            echo "Graduating seniors and external members are left alone on purpose —"
            echo "those transitions need a human. Review and merge if this looks right."
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(people): advance student years for AY $YEAR" \
            --body-file "$RUNNER_TEMP/pr-body.md"
