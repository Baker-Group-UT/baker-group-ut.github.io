name: Sync publications from OpenAlex

# Runs on the 1st and 15th of every month at 06:00 UTC (cron can't express
# a true "every two weeks"), and on-demand via the "Run workflow" button in
# the Actions tab (workflow_dispatch) or `gh workflow run
# sync-publications.yml` from the command line.
on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

# Never let two sync runs race each other (e.g. a manual run overlapping
# the scheduled one) — the second would fail to push.
concurrency:
  group: sync-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed by `gh pr create` below. A repository ruleset on main requires
      # changes to arrive via pull request, so this job can't push to main
      # directly — it opens a PR instead.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run publication sync
        env:
          # OpenAlex asks that you identify yourself via a contact email in
          # the "polite pool" query param. Set OPENALEX_MAILTO as a repo
          # secret (or environment variable) to override the default below.
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO || 'jonathan.baker@austin.utexas.edu' }}
        run: npm run sync-publications

      - name: Commit changes and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "publication-sync[bot]"
          git config user.email "publication-sync[bot]@users.noreply.github.com"
          git add src/content/publications src/data/sync-status.json
          # sync-status.json changes every run (it carries the run timestamp),
          # so gate the commit on actual publication changes to avoid a
          # pointless PR every month.
          if git diff --staged --quiet -- src/content/publications; then
            echo "No publication changes to commit."
            exit 0
          fi

          # One branch per run date. Re-running the same day updates the
          # existing branch (and therefore the existing PR) rather than
          # piling up near-identical ones.
          BRANCH="sync/publications-$(date -u +%Y%m%d)"
          # -B rather than -b: the runner checks out fresh so the branch
          # normally won't exist, but -b would hard-fail on a same-day
          # re-run or when this step is exercised locally.
          git checkout -B "$BRANCH"
          git commit -m "chore(sync): update publications from OpenAlex"
          # The branch is owned exclusively by this workflow, so overwriting
          # a same-day run's commit is the intended behaviour.
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR for $BRANCH is already open — pushed an update to it."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(sync): update publications from OpenAlex" \
            --body "$(cat <<'BODY'
          Automated publication sync from [OpenAlex](https://openalex.org).

          Generated by `.github/workflows/sync-publications.yml` via
          `npm run sync-publications`. Only files marked `synced: true` are
          touched; manually authored publication entries are left alone.

          Review the diff and merge if it looks right.
          BODY
          )"
